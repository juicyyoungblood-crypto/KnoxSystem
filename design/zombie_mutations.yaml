  heavy_hit_2:
    id: heavy_hit_2
    display: Heavy Hit II
    analyze_label: Heavy Hit II
    modifier_tier: 2
    family: heavy_hit
    kind: percent
    potency: 2
    effects:
      damage_dealt_mult_player: 1.30
      thump_damage_mult_doors_windows: 1.50

  relentless:
    id: relentless
    display: Relentless
    analyze_label: Relentless
    modifier_tier: 1
    family: relentless
    kind: binary
    effects:
      knockdown_immune: true
      # stagger/knockback still apply unless Anchored

  # ----- Tier 2 -----
  anchored:
    id: anchored
    display: Anchored
    analyze_label: Anchored
    modifier_tier: 2
    family: anchored
    kind: binary
    effects:
      knockback_immune: true
      stagger_immune: true
      knockdown_immune: true
    stamp_rules:
