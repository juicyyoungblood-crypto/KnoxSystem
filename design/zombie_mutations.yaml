analyze:
  l1: hp_and_elite_tell
  l2_mods_line:
    format: single_long_line
    join: " - "
    include: [modifier_labels, elite_rank_zombie_label, sprinter_or_runner_walk]
    order: [elite_rank_zombie, modifier_tier_desc, name]
    show_full_list: true
    elite_rank_examples:
      - Apex Zombie
      - Elite Zombie
      - System Elite Zombie
      - System Champion Zombie
  labels_map_note: extend KS_Analyze.MOD_LABELS from this catalog at impl

