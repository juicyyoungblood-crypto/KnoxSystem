    analyze_label: Thick Skin II
    modifier_tier: 2
    family: thick_skin
    kind: percent
    potency: 2
    effects:
      damage_taken_mult_blunt: 0.70   # -30% (2× reduction of I)

  hardened_skin:
    id: hardened_skin
    display: Hardened Skin
    analyze_label: Hardened Skin
    modifier_tier: 1
    family: hardened_skin
    kind: percent
    potency: 1
    effects:
      damage_taken_mult_blade: 0.85

  hardened_skin_2:
    id: hardened_skin_2
    display: Hardened Skin II
    analyze_label: Hardened Skin II
    modifier_tier: 2
    family: hardened_skin
    kind: percent
    potency: 2
    effects:
      damage_taken_mult_blade: 0.70

  heavy_hit:
    id: heavy_hit
    display: Heavy Hit
    analyze_label: Heavy Hit
    modifier_tier: 1
    family: heavy_hit
    kind: percent
    potency: 1
    effects:
      damage_dealt_mult_player: 1.15
