# Knox System — Personal Level, Personal XP, Skill Points, class unlock
status: locked_structure
numbers_status: draft_numbers

personal_level:
  min: 0
  max: 100
  character_start:
    level: 0
    personal_xp: 0
    skill_points: 0
  # Cumulative Personal XP required to BE this level (anchors locked).
  cumulative_xp_anchors:
    1: 375
    10: 10500
    100: 2089350
  curve:
    type: cubic_through_anchors
    # C(L) = a*L + b*L^2 + c*L^3 fitted to anchors (L>0). C(0)=0.
    coefficients:
      a: 314.6952861952857
      b: 58.83518518518534
      c: 1.469528619528618
    note: >
      Thresholds are fixed Personal XP totals. Weights only change earn rate.
      Traits and SP purchases affect how players reach thresholds.

personal_xp:
  primary_source: on_base_skill_xp_gained
  formula: personal_xp_delta = skill_xp_gained * weight(skill_id) * (sandbox.PersonalXpPercent / 100)
  sandbox:
    PersonalXpPercent: { min: 10, max: 500, default: 100 }  # 100 = full weight tables
    ClassSkillPersonalXpPercent: { min: 10, max: 500, default: 50 }  # 50 = old half-bucket; 100 = 1:1
  class_skill_xp_also_mints_personal_xp: true
  class_skill_personal_xp_formula: personal_xp_delta = class_skill_xp_gained * (sandbox.ClassSkillPersonalXpPercent / 100)
  class_skill_weight_factor: 0.5  # legacy design note; live default embodied as ClassSkillPersonalXpPercent=50
  quest_system_hooks: deferred

skill_points:
  default_grant_per_personal_level: 1
  schedule:
    type: data_driven
    default: one_per_level
    # Future: milestone lumps or skipped levels without redesign.
    overrides: []
    # example override: { at_level: 10, bonus_sp: 2 }
  spend_targets:
    base_skills: true
    personal_stats: true
    class_skills: false
  base_skill_purchase:
    effect: instant_level_up  # same as having earned the level
    refunds_base_skill_xp: false
    spends_base_skill_xp: false
    # Cost to buy skill level L (from L-1): ceil(L / 2)
    # L1-2 → 1, L3-4 → 2, ... scales with mod-raised caps
    cost_formula: ceil(target_level / 2)
    max_level: respect_skill_cap  # vanilla 10 or mod cap

class_unlock:
  personal_level_required: 10
  choice: permanent
  multiclass: false
  respec: false
  mvp_selectable: [warrior]
  ui_shows_unstubbed_as: coming_later_not_selectable

class_skills_global:
  level_min: 0
  level_max_default: 10
  respect_mod_raised_caps: true
  xp_table:
    type: triple_regular_base_skill
    # Exact 3× regular base per-level XP (table, not runtime formula). L4 = 3000.
    note: Implemented in KS_Class.xpToNext as CLASS_XP_TO_NEXT[current_level]
    xp_to_reach_level:
      1: 225
      2: 450
      3: 900
      4: 3000
      5: 4500
      6: 9000
      7: 13500
      8: 18000
      9: 22500
      10: 27000
    total_to_10: 99075
  purchased_with_sp: false

specializations:
  status: deferred
  planned_unlock_levels: [25, 50]
  note: May require mana for actives even on non-Mage base classes later.
