# Knox System — Personal Stats
status: locked_structure
numbers_status: draft_numbers

rules:
  max_level: 20
  sp_cost_per_level: 1
  distinct_from_base_skills: true
  stack_with_class_skills: multiplicative
  hard_cap_on_total_bonuses: none_in_mvp  # tune magnitudes instead

stats:
  Power:
    sp_name: Power
    was: Strength
    status: live_hidden_effective_strength_0.5.127
    not: base_skill_Strength
    max_level: 10
    sp_cost_per_level: 2
    effect_per_level:
      type: hidden_effective_strength_rank
      magnitude: 1  # each Power level adds +1 to Strength checks via getPerkLevel(Strength)
    implementation:
      storage: ModData stat_power  # no Skills-tab perk icon / no PerkFactory skill row
      hook: IsoPlayer_getPerkLevel_Strength_returns_real_plus_Power
      raw_api: Power.withRawPerkLevel / getStrengthReal for UI and SP skill cart
    removed_live_hooks:
      - melee_damage_mult
      - knockdown_chance
      - carry_maxWeight_bonus
      - window_smash_speed
    note: >
      Strength skill UI/XP should use real level (System tab SP cart forced raw).
      Gameplay Lua that calls getPerkLevel(Strength) sees real+Power.
      Pure Java paths that bypass Lua getPerkLevel may need future bridges.
    draft_targets:
      - carry_capacity_related_outcomes
      - melee_damage_related_strength_outcomes
      - knockdown_push_force
      - window_door_force
      - other_vanilla_strength_effect_hooks

  Strength:
    deprecated: true
    renamed_to: Power
    note: UI/ModData use Power / stat_power; stat_strength mirrored for old saves.

  Endurance:
    sp_name: Endurance
    not: base_skill_Fitness
    effect_per_level:
      type: outcome_multiplier_on_base_fitness_effectiveness
      magnitude: 0.05
    draft_targets:
      - endurance_recovery
      - endurance_drain_while_running
      - other_vanilla_fitness_effect_hooks
    note: Does not replace base Fitness skill progression.

  Mind:
    sp_name: Mind
    always_visible: true
    effect_per_level:
      spell_damage_multiplier: 0.05
      max_mana_bonus_flat: 5  # draft
      mana_regen_per_second_bonus: 0.05  # draft
    non_mage_in_mvp: largely_weak_choice
    future: specializations_may_spend_mana_on_non_mage_classes

  Resilience:
    sp_name: Resilience
    status: live_infection_and_disease_resist_0.5.119
    effect_per_level:
      system_infection_catch_chance_additive_pp: -5  # resistChance% = 5 * level
      disease_resist_same_chance: true  # cold, food sickness, fake-inf, wound sepsis, poison
      innate_healing_speed: 0.05  # +5% per level (not live yet)
      healing_hooks: [general_health_recovery, bandage_wound_closing]
    infection_resist_runtime:
      detect: bodyDamage_isInfected_rising_edge_or_process
      resist_chance_percent: "min(100, 5 * Resilience)"
      roll: "ZombRand(100)  # 0..99; success if roll < chance"
      on_success: [full_knox_purge, halo]
      at_level_20: always_resist
    disease_resist_runtime:
      covers: [cold, food_sickness, fake_infection_sickness, wound_infection, poison]
      same_chance_as_system_infection: true
      on_success: [clear_cold_food_fake_wound_poison, halo]
      at_level_20: continuous_scrub
    at_level_20:
      system_infection_immune: true
      disease_immune: true
      blocks_rising_on_death: true  # Phase 6 — not live yet
    below_20_rising: always_rise_on_human_death
